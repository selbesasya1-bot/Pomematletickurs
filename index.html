<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kurs Takip</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  color:#20242a
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:22px
}

.head,.panel{
  background:#fff;
  border:1px solid #e1e5ea;
  border-radius:16px
}

.head{
  padding:18px 20px;
  margin-bottom:16px
}

.logo{
  font-size:22px;
  font-weight:800
}

.sub{
  font-size:13px;
  color:#737b86;
  margin-top:4px
}

.courses{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:16px
}

.course{
  background:#fff;
  border:1px solid #e1e5ea;
  border-radius:14px;
  padding:15px;
  cursor:pointer
}

.course.active{
  border-color:#697481;
  box-shadow:0 3px 12px #0001
}

.ct{
  font-weight:800
}

.count{
  font-size:13px;
  color:#747d88;
  margin-top:6px
}

.top{
  padding:17px 18px;
  border-bottom:1px solid #e6e8eb;
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap
}

.title{
  font-weight:800
}

.month{
  font-size:13px;
  color:#6e7680;
  margin-top:4px
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

input,select,button{
  font:inherit
}

input,select,button{
  border:1px solid #d8dde3;
  border-radius:9px;
  padding:9px 11px;
  background:#fff
}

button{
  cursor:pointer
}

.primary{
  background:#20252b;
  color:#fff;
  border-color:#20252b
}

.tablewrap{
  overflow:auto
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:850px
}

th,td{
  border-right:1px solid #e7e9ec;
  border-bottom:1px solid #e7e9ec;
  text-align:center;
  height:48px
}

th{
  height:44px;
  background:#fafbfc;
  font-size:12px;
  color:#5f6771
}

th:first-child,
td:first-child{
  text-align:left;
  padding:0 14px;
  min-width:190px;
  position:sticky;
  left:0
}

th:first-child{
  background:#fafbfc
}

.att{
  width:100%;
  height:100%;
  border:0;
  border-radius:0;
  font-size:20px
}

.att:hover{
  background:#f4f6f8
}

.name{
  font-weight:650
}

.pay,.status{
  font-size:13px;
  font-weight:700;
  padding:8px 10px;
  border-radius:999px;
  border:0
}

.paid,.activeStatus{
  background:#e9f7ee;
  color:#18733c
}

.unpaid,.leftStatus{
  background:#fff1f1;
  color:#b42318
}

.footer{
  padding:13px 18px;
  color:#737b86;
  font-size:12px;
  background:#fafbfc
}

/* AYARLAR PENCERESİ */

.modalBack{
  position:fixed;
  inset:0;
  background:#0007;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:10
}

.modal{
  background:#fff;
  border-radius:16px;
  width:min(430px,100%);
  padding:20px;
  box-shadow:0 15px 50px #0003
}

.modal h3{
  margin:0 0 6px
}

.modal p{
  margin:0 0 16px;
  color:#68717c;
  font-size:13px
}

.dayGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px
}

.day{
  border:1px solid #d8dde3;
  border-radius:10px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer
}

.day input{
  width:18px;
  height:18px
}

.modalActions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px
}

@media(max-width:650px){

  .wrap{
    padding:10px
  }

  .courses{
    gap:8px
  }

  .course{
    padding:12px
  }

  .actions{
    width:100%
  }

  .actions input{
    flex:1;
    min-width:0
  }

  .logo{
    font-size:19px
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="head">
    <div class="logo">Kurs Takip</div>
    <div class="sub">Öğrenci • Devam • Aylık Ödeme</div>
  </div>

  <div class="courses" id="courses"></div>

  <section class="panel">

    <div class="top">

      <div>
        <div class="title" id="courseTitle"></div>
        <div class="month" id="monthTitle"></div>
      </div>

      <div class="actions">

        <input
          id="search"
          placeholder="Öğrenci ara..."
          oninput="renderTable()"
        >

        <button
          class="primary"
          onclick="addStudent()"
        >
          + Öğrenci
        </button>

        <button onclick="openSettings()">
          ⚙ Ayarlar
        </button>

        <select
          id="month"
          onchange="changeMonth(this.value)"
        ></select>

      </div>
    </div>

    <div class="tablewrap">

      <table>

        <thead id="thead"></thead>

        <tbody id="tbody"></tbody>

      </table>

    </div>

    <div
      class="footer"
      id="footer"
    ></div>

  </section>

</div>


<!-- AYARLAR MODALI -->

<div
  class="modalBack"
  id="settingsModal"
>

  <div class="modal">

    <h3 id="settingsTitle">
      Kurs günleri
    </h3>

    <p>
      Bu kursun eğitim yaptığı günleri seç.
    </p>

    <div
      class="dayGrid"
      id="dayGrid"
    ></div>

    <div class="modalActions">

      <button onclick="closeSettings()">
        İptal
      </button>

      <button
        class="primary"
        onclick="saveSettings()"
      >
        Kaydet
      </button>

    </div>

  </div>

</div>


<script>

/* ANA VERİ */

const KEY='kursTakipV1';


/* EKİM 2026 - EYLÜL 2027 ARASI TÜM AYLAR */

const ALL_MONTHS=[

  '2026-10',
  '2026-11',
  '2026-12',

  '2027-01',
  '2027-02',
  '2027-03',
  '2027-04',
  '2027-05',
  '2027-06',
  '2027-07',
  '2027-08',
  '2027-09'

];


/* İLK BAŞLANGIÇ VERİLERİ */

const defaultState={

  course:'POMEM',

  courses:{

    POMEM:{

      days:[1,3,5],

      students:[

        {
          name:'Ayşe Yılmaz',
          pay:false,
          status:'active',
          a:{}
        },

        {
          name:'Mehmet Kaya',
          pay:true,
          status:'active',
          a:{}
        },

        {
          name:'Elif Demir',
          pay:false,
          status:'active',
          a:{}
        },

        {
          name:'Can Özkan',
          pay:true,
          status:'active',
          a:{}
        }

      ]

    },


    BESYO:{

      days:[2,4,6],

      students:[]

    },


    PMYO:{

      days:[1,4],

      students:[]

    }

  },

  months:[...ALL_MONTHS]

};


/* ESKİ KAYITLARI YÜKLE */

let state=
  JSON.parse(
    localStorage.getItem(KEY)||'null'
  )||defaultState;


/*
  ÖNEMLİ:
  Daha önce kaydedilmiş eski veride
  sadece Ekim varsa bile 12 ayı tekrar oluştur.
*/

state.months=[...ALL_MONTHS];


/* Eski öğrencilerde status yoksa aktif yap */

Object.values(state.courses).forEach(c=>{

  c.students.forEach(s=>{

    if(!s.status){

      s.status='active';

    }

  });

});


/* Başlangıç ayı */

let currentMonth='2026-10';


/* Ayarlar için geçici günler */

let settingsDays=[];


/* KAYDET */

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(state)
  );

}


/* AYI GÜZEL YAZDIR */

function monthLabel(m){

  const [y,mo]=m.split('-');

  return new Intl.DateTimeFormat(
    'tr-TR',
    {
      month:'long',
      year:'numeric'
    }
  ).format(
    new Date(
      +y,
      +mo-1,
      1
    )
  );

}


/* SEÇİLİ EĞİTİM GÜNLERİNİ BUL */

function datesFor(m,days){

  const [y,mo]=m.split('-');

  const last=
    new Date(
      +y,
      +mo,
      0
    ).getDate();

  const a=[];

  for(
    let d=1;
    d<=last;
    d++
  ){

    const x=
      new Date(
        +y,
        +mo-1,
        d
      );

    const wi=
      x.getDay()===0
      ?7
      :x.getDay();

    if(days.includes(wi)){

      a.push({
        date:d,
        wi
      });

    }

  }

  return a;

}


/* GÜN İSMİ */

function dayName(wi){

  return [
    '',
    'Pzt',
    'Sal',
    'Çar',
    'Per',
    'Cum',
    'Cmt',
    'Paz'
  ][wi];

}


/* KURS KARTLARI */

function renderCourses(){

  const names=[
    'POMEM',
    'BESYO',
    'PMYO'
  ];

  document.getElementById(
    'courses'
  ).innerHTML=

    names.map(n=>`

      <div
        class="course ${state.course===n?'active':''}"
        onclick="selectCourse('${n}')"
      >

        <div class="ct">
          ${n}
        </div>

        <div class="count">
          ${state.courses[n].students.length}
          öğrenci
        </div>

      </div>

    `).join('');

}


/* AYLAR */

function renderMonths(){

  const s=
    document.getElementById(
      'month'
    );

  s.innerHTML=

    ALL_MONTHS.map(m=>`

      <option value="${m}">
        ${monthLabel(m)}
      </option>

    `).join('');

  s.value=currentMonth;

}


/* TABLOYU OLUŞTUR */

function renderTable(){

  const c=
    state.courses[state.course];

  const ds=
    datesFor(
      currentMonth,
      c.days
    );

  const q=
    document.getElementById(
      'search'
    ).value.toLowerCase();


  document.getElementById(
    'courseTitle'
  ).textContent=
    state.course;


  document.getElementById(
    'monthTitle'
  ).textContent=
    monthLabel(currentMonth);


  /* TABLO BAŞLIĞI */

  document.getElementById(
    'thead'
  ).innerHTML=

    '<tr>' +

    '<th>Öğrenci</th>' +

    ds.map(x=>`

      <th>
        ${dayName(x.wi)}
        <br>
        ${String(x.date).padStart(2,'0')}.${currentMonth.split('-')[1]}
      </th>

    `).join('') +

    `<th>
      ${monthLabel(currentMonth).split(' ')[0].toUpperCase()}
      ÖDEME
    </th>

    <th>DURUM</th>

    </tr>`;


  /* ÖĞRENCİLER */

  document.getElementById(
    'tbody'
  ).innerHTML=

    c.students

      .filter(s=>
        s.name
          .toLowerCase()
          .includes(q)
      )

      .map(s=>{

        const i=
          c.students.indexOf(s);


        return `

        <tr>

          <td>
            <span class="name">
              ${escapeHtml(s.name)}
            </span>
          </td>


          ${ds.map(x=>{

            const k=
              currentMonth+
              '-' +
              String(x.date).padStart(2,'0');

            const v=
              s.a[k]||'—';


            return `

              <td>

                <button
                  class="att"
                  onclick="attendance(${i},'${k}')"
                >
                  ${
                    v==='yes'
                    ?'✅'
                    :v==='no'
                    ?'❌'
                    :'—'
                  }
                </button>

              </td>

            `;

          }).join('')}


          <td>

            <button
              class="pay ${s.pay?'paid':'unpaid'}"
              onclick="payment(${i})"
            >
              ${
                s.pay
                ?'Ödedi'
                :'Ödemedi'
              }
            </button>

          </td>


          <td>

            <button
              class="status ${
                s.status==='left'
                ?'leftStatus'
                :'activeStatus'
              }"
              onclick="studentStatus(${i})"
            >

              ${
                s.status==='left'
                ?'Kursu bıraktı'
                :'Kursa devam ediyor'
              }

            </button>

          </td>

        </tr>

        `;

      })

      .join('');


  /* ALT BİLGİ */

  document.getElementById(
    'footer'
  ).textContent=

    state.course+
    ' eğitim günleri: '+
    c.days
      .map(dayName)
      .join(' • ');

}


/* GÜVENLİ İSİM GÖSTERİMİ */

function escapeHtml(v){

  return v.replace(
    /[&<>"']/g,
    m=>({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'

    }[m])

  );

}


/* KURS DEĞİŞTİR */

function selectCourse(n){

  state.course=n;

  currentMonth='2026-10';

  save();

  renderAll();

}


/* DEVAM DURUMU */

function attendance(i,k){

  const s=
    state
      .courses[state.course]
      .students[i];

  const v=
    s.a[k]||'—';


  s.a[k]=

    v==='—'
    ?'yes'
    :v==='yes'
    ?'no'
    :'—';


  save();

  renderTable();

}


/* ÖDEME */

function payment(i){

  const s=
    state
      .courses[state.course]
      .students[i];

  s.pay=!s.pay;

  save();

  renderTable();

}


/* ÖĞRENCİ DURUMU */

function studentStatus(i){

  const s=
    state
      .courses[state.course]
      .students[i];


  s.status=
    s.status==='left'
    ?'active'
    :'left';


  save();

  renderTable();

  renderCourses();

}


/* ÖĞRENCİ EKLE */

function addStudent(){

  const n=
    prompt(
      'Öğrenci adı soyadı:'
    );


  if(
    !n ||
    !n.trim()
  ){

    return;

  }


  state
    .courses[state.course]
    .students
    .push({

      name:n.trim(),

      pay:false,

      status:'active',

      a:{}

    });


  save();

  renderAll();

}


/* AY DEĞİŞTİR */

function changeMonth(v){

  currentMonth=v;

  renderTable();

}


/* AYARLARI AÇ */

function openSettings(){

  settingsDays=[
    ...state
      .courses[state.course]
      .days
  ];


  document.getElementById(
    'settingsTitle'
  ).textContent=

    state.course+
    ' eğitim günleri';


  const labels=[

    'Pazartesi',
    'Salı',
    'Çarşamba',
    'Perşembe',
    'Cuma',
    'Cumartesi',
    'Pazar'

  ];


  document.getElementById(
    'dayGrid'
  ).innerHTML=

    labels.map(
      (label,i)=>{

        const day=i+1;

        return `

          <label class="day">

            <input
              type="checkbox"
              value="${day}"
              ${
                settingsDays.includes(day)
                ?'checked'
                :''
              }
            >

            ${label}

          </label>

        `;

      }
    ).join('');


  document.getElementById(
    'settingsModal'
  ).style.display='flex';

}


/* AYARLARI KAPAT */

function closeSettings(){

  document.getElementById(
    'settingsModal'
  ).style.display='none';

}


/* AYARLARI KAYDET */

function saveSettings(){

  const selected=

    [
      ...document.querySelectorAll(
        '#dayGrid input:checked'
      )
    ]

    .map(
      x=>Number(x.value)
    );


  if(!selected.length){

    alert(
      'En az bir eğitim günü seçmelisin.'
    );

    return;

  }


  state
    .courses[state.course]
    .days=

      selected.sort(
        (a,b)=>a-b
      );


  save();

  closeSettings();

  renderTable();

}


/* HER ŞEYİ YENİLE */

function renderAll(){

  renderCourses();

  renderMonths();

  renderTable();

}


/* BAŞLAT */

renderAll();

</script>

</body>
  </html>
